<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Connection Mapper</title>
  <meta name="theme-color" content="#171c25">
  <meta name="description" content="PC周辺機器の接続関係を視覚化するWebアプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=1.27">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">⌘</span>
        <span>PC Connection Mapper</span>
        <span class="version">v1.27</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="toggleLeftBtn">デバイス</button>
        <button class="btn ghost" id="toggleRightBtn">プロパティ</button>
        <button class="btn icon-action" id="undoBtn" title="元に戻す (Ctrl+Z)" disabled>↶</button>
        <button class="btn icon-action" id="redoBtn" title="やり直す (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button>
        <button class="btn" id="newBtn">新規作成</button>
        <button class="btn" id="sampleBtn">サンプル</button>
        <button class="btn" id="titleBtn">タイトル</button>
        <button class="btn" id="connectBtn">機器を接続</button>
        <button class="btn" id="jsonSaveBtn">JSON保存</button>
        <button class="btn" id="jsonLoadBtn">JSON読込</button>
        <input id="jsonFileInput" type="file" accept=".json,application/json" hidden>
        <button class="btn primary" id="pngBtn">PNG出力</button>
        <button class="btn ghost help-btn" id="helpBtn" title="使い方">?</button>
      </div>
    </header>

    <aside class="sidebar left-panel" id="leftPanel">
      <div class="panel-title">デバイス</div>
      <div class="device-search-wrap">
        <svg class="device-search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="deviceSearch" class="device-search-input" type="search" autocomplete="off" placeholder="デバイスを検索…">
        <button id="clearDeviceSearchBtn" class="device-search-clear" type="button" title="検索をクリア" hidden>×</button>
      </div>
      <div class="palette" id="palette"></div>
      <div class="panel-box">
        <div class="panel-title small-title">配置</div>
        <label class="check-row">
          <input id="snapToggle" type="checkbox" checked>
          <span>20pxグリッドに吸着</span>
        </label>
        <button class="btn group-add-btn" id="addGroupBtn">＋ グループ枠を追加</button>
      </div>
    </aside>

    <main class="viewport" id="viewport">
      <div class="world" id="world">
        <svg id="links" class="links"></svg>
        <div id="groups" class="groups-layer"></div>
        <div id="diagramTitleLayer" class="diagram-title-layer"></div>
        <div id="nodes" class="nodes"></div>
        <div id="guides" class="guides-layer"></div>
      </div>

      <div class="canvas-hint">
        カードをドラッグ / 自動ガイドで整列 / Shift+クリックで複数選択 / 空白ドラッグで移動
      </div>

      <div class="view-controls" id="viewControls">
        <button class="view-btn" id="zoomOutBtn" title="縮小">−</button>
        <button class="view-btn zoom-value" id="resetZoomBtn" title="100%に戻す">100%</button>
        <button class="view-btn" id="zoomInBtn" title="拡大">＋</button>
        <button class="view-btn fit-btn" id="fitBtn">全体表示</button>
      </div>
    </main>

    <aside class="sidebar right-panel" id="rightPanel">
      <div class="panel-title">プロパティ</div>
      <div id="properties" class="properties-empty">機器またはケーブルを選択してください。</div>
    </aside>
  </div>

  <div class="modal-backdrop" id="exportModal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">書き出し</h2>
        <button class="icon-btn" id="modalCloseBtn">×</button>
      </div>
      <div id="modalContent"></div>
      <div class="modal-actions">
        <a class="btn primary" id="modalDownloadLink" download>保存</a>
        <button class="btn" id="copyJsonBtn" hidden>JSONをコピー</button>
        <button class="btn" id="modalCloseBtn2">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js?v=1.27"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.27', { updateViaCache: 'none' }).catch(console.warn);
      });
    }
  </script>
</body>
</html>
